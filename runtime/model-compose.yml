# Restore recipe. Export ODYSSEUS_MODEL_CACHE as the absolute Hugging Face hub path.
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp@sha256:883915ea20a4b350e98f7284098f4d400c21e9b366e248d397cd42d90602a84c
    container_name: odysseus-llama
    restart: "no"
    volumes:
      - "${ODYSSEUS_MODEL_CACHE:?Set the absolute Hugging Face hub path}:/models:ro"
    command:
      - -m
      - /models/models--unsloth--Qwen3-14B-GGUF/snapshots/a04a82c4739b3ef5fa6da7d10261db2c67dd1985/Qwen3-14B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --n-gpu-layers
      - "99"
      - --ctx-size
      - "20000"
      - --parallel
      - "1"
      - --alias
      - qwen3-14b
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks: [odysseus]
networks:
  odysseus:
    external: true
    name: odysseus_default
